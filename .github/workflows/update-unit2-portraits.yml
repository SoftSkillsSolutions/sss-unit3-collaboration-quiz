name: Update Unit 2 portrait assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-unit2-portraits.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download approved high-quality portraits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unit2-emotions
          curl -L --fail --retry 3 "https://at.adobe.com/Mh6HY1xC2sXq5YAl" -o unit2-emotions/q1.png
          curl -L --fail --retry 3 "https://at.adobe.com/TOdamafkLWASqyHr" -o unit2-emotions/q2.png
          curl -L --fail --retry 3 "https://at.adobe.com/gd81GNxDYi3Rg00f" -o unit2-emotions/q3.png
          curl -L --fail --retry 3 "https://at.adobe.com/EKpXTZ0adb9QrYqi" -o unit2-emotions/q4.png
          curl -L --fail --retry 3 "https://at.adobe.com/hg67vozEJALIvAb4" -o unit2-emotions/q5.png
          curl -L --fail --retry 3 "https://at.adobe.com/0LaYMcSTuuXN8jQ9" -o unit2-emotions/q6.png
          curl -L --fail --retry 3 "https://at.adobe.com/PNHYLvppXnAvRN55" -o unit2-emotions/q7.png
          curl -L --fail --retry 3 "https://at.adobe.com/RHAKI1X0xYHrxLII" -o unit2-emotions/q8.png
          curl -L --fail --retry 3 "https://at.adobe.com/BxcAw0zpoXa3UKpu" -o unit2-emotions/q9.png
          curl -L --fail --retry 3 "https://at.adobe.com/AP6qTqKLUla88GoT" -o unit2-emotions/q10.png

          for f in unit2-emotions/q{1..10}.png; do
            test -s "$f"
            size=$(stat -c%s "$f")
            if [ "$size" -lt 100000 ]; then
              echo "Downloaded file is unexpectedly small: $f ($size bytes)"
              exit 1
            fi
            file "$f" | grep -qi "PNG image data"
          done

      - name: Point quiz at PNG portraits and remove old thumbnails
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("unit2-emotions/index.html")
          s = p.read_text(encoding="utf-8")
          for i in range(1, 11):
              s = s.replace(f"q{i}.jpg", f"q{i}.png")
          s = s.replace("sss-logo.jpg", "../Skillforce%20logo%20form.png")
          p.write_text(s, encoding="utf-8")
          PY
          rm -f unit2-emotions/q1.jpg unit2-emotions/q2.jpg unit2-emotions/q3.jpg unit2-emotions/q4.jpg unit2-emotions/q5.jpg
          rm -f unit2-emotions/q6.jpg unit2-emotions/q7.jpg unit2-emotions/q8.jpg unit2-emotions/q9.jpg unit2-emotions/q10.jpg
          rm -f unit2-emotions/sss-logo.jpg

      - name: Commit updated live quiz
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unit2-emotions
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Upgrade Unit 2 quiz portraits and Skillforce branding"
          git push
